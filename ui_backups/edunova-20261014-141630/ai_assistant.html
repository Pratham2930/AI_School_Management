
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="csrf-token"
          content="{{ csrf_token() }}">

    <title>AI School Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
            overflow: hidden;
        }

        .header {
            background: #173b74;
            color: white;
            padding: 22px;
        }

        .header h2 {
            margin: 0 0 8px;
        }

        .messages {
            height: 450px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .bot {
            background: #edf2fa;
            align-self: flex-start;
        }

        .user {
            background: #173b74;
            color: white;
            align-self: flex-end;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #173b74;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
    <!-- EduSphere professional theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edusphere_professional_theme.css') }}">
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>AI School Assistant</h2>
        <p>
            Welcome {{ current_user.name }}
            ({{ current_user.role }})
        </p>
    </div>

    <div id="messages" class="messages" role="log"
         aria-live="polite">
        <div class="message bot">
            Hello! Type help to get started.
        </div>
    </div>

    <form id="chatForm">
        <input
            id="question"
            type="text"
            placeholder="Ask your question..."
            maxlength="1000"
            required
        >

        <button id="sendButton" type="submit">
            Send
        </button>
    </form>

</div>

<script>
    const form = document.getElementById("chatForm");
    const messages = document.getElementById("messages");
    const question = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
        const item = document.createElement("div");

        item.className = "message " + type;

        // Prevent HTML injection.
        item.textContent = text;

        messages.appendChild(item);

        messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = question.value.trim();

        if (!message) return;

        addMessage(message, "user");

        question.value = "";
        sendButton.disabled = true;

        try {
            const response = await fetch(
                "{{ url_for('ai_assistant_chat') }}",
                {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector(
                            'meta[name="csrf-token"]'
                        ).content
                    },
                    body: JSON.stringify({message})
                }
            );

            if (response.redirected) {
                throw new Error(
                    "Session expired. Please log in again."
                );
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Request failed."
                );
            }

            addMessage(data.reply, "bot");

        } catch (error) {
            addMessage(error.message, "bot");
        } finally {
            sendButton.disabled = false;
            question.focus();
        }
    });
</script>

</body>
</html>
