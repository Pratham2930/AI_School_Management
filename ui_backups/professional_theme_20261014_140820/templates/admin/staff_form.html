<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Edit' if staff_member else 'Add' }} Staff</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        .page { max-width: 800px; margin: 0 auto; }
        .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">

    <!-- EduSphere shared navigation -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edusphere_navigation.css') }}">
</head>
<body>
<main class="full-page page">
    <header class="topbar">
        <div><h1>{{ 'Edit' if staff_member else 'Add' }} Staff</h1><p>Maintain a non-teaching staff record.</p></div>
        <a class="primary-link" href="{{ url_for('admin_staff') }}">Back to staff</a>
    </header>
    {% for message in get_flashed_messages() %}<div class="alert">{{ message }}</div>{% endfor %}
    <section class="panel">
        <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="employee_id">Employee ID</label>
                <input id="employee_id" name="employee_id" maxlength="50" value="{{ request.form.get('employee_id', staff_member.employee_id if staff_member else '') }}" required>
            </div>
            <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" maxlength="100" value="{{ request.form.get('name', staff_member.name if staff_member else '') }}" required>
            </div>
            <div class="field">
                <label for="position">Position</label>
                <input id="position" name="position" maxlength="100" value="{{ request.form.get('position', staff_member.position if staff_member else '') }}" required>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" maxlength="30" value="{{ request.form.get('phone', staff_member.phone if staff_member else '') }}">
            </div>
            <button class="primary-btn" type="submit">Save staff record</button>
        </form>
    </section>
</main>

    <!-- EduSphere role navigation -->
    {% include "components/edu_admin_sidebar.html" %}
    <script src="{{ url_for('static', filename='js/edusphere_navigation.js') }}"></script>
</body>
</html>
