<!DOCTYPE html>
<html>
<head>

    <title>School Setup</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
    <!-- EduSphere professional theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edusphere_professional_theme.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/edunova_theme.css') }}">
</head>

<body class="auth-page">

<div class="auth-card">

    <div class="school-logo">
        AI SCHOOL
    </div>

    <h1>School Setup</h1>

    <p class="muted">
        Create the first Super Administrator.
    </p>


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="alert">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>
            Administrator Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter full name"
            required
        >


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Choose username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 8 characters"
            required
        >

<label for="confirm_password">
    Confirm Password
</label>

<input
    type="password"
    id="confirm_password"
    name="confirm_password"
    placeholder="Re-enter password"
    minlength="8"
    autocomplete="new-password"
    required
>
        <button
            class="primary-btn"
            type="submit"
        >
            Create Super Admin
        </button>

    </form>

</div>

</body>
</html>
